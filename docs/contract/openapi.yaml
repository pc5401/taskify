openapi: 3.1.0
info:
  title: Taskify API
  version: 0.2.1
  summary: Board-scoped kanban contract for FE, BE, and QA agents.
  description: |
    v0.2 contract. Own backend. PostgreSQL.
    Blocked is computed, never stored.
    If this file and the markdown disagree on field names, this file wins.
    If they disagree on locks or product policy, the markdown wins.


    v0.2.1 adds success descriptions, BoardListItem.myRole, and explicit version-conflict examples.
servers:
  - url: /v1
tags:
  - name: Auth
  - name: Boards
  - name: Members
  - name: Invitations
  - name: Columns
  - name: Cards
  - name: Comments
  - name: Notifications
  - name: Search
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
        - Auth
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/EmailTaken'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /auth/login:
    post:
      tags:
        - Auth
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      responses:
        '204':
          description: Refresh revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/refresh:
    post:
      tags:
        - Auth
      security: []
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Rotated tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /me:
    get:
      tags:
        - Auth
      operationId: getMe
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Current user profile.
    patch:
      tags:
        - Auth
      operationId: patchMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMeRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Updated user profile. This resource is not version-locked.
        '422':
          $ref: '#/components/responses/InvalidInput'
  /me/password:
    post:
      tags:
        - Auth
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '204':
          description: Changed
        '422':
          $ref: '#/components/responses/InvalidInput'
  /boards:
    get:
      tags:
        - Boards
      operationId: listBoards
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardPage'
          description: Boards where the caller is a member. Each item includes myRole.
        '422':
          $ref: '#/components/responses/InvalidInput'
    post:
      tags:
        - Boards
      operationId: createBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBoardRequest'
      responses:
        '201':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: >-
            Board created with the caller as OWNER and three default columns. ETag is the board
            version.
        '422':
          $ref: '#/components/responses/InvalidInput'
  /boards/{boardId}:
    parameters:
      - $ref: '#/components/parameters/boardId'
    get:
      tags:
        - Boards
      operationId: getBoard
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: Board visible to members. ETag is the board version.
        '403':
          $ref: '#/components/responses/NotMember'
    patch:
      tags:
        - Boards
      operationId: patchBoard
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchBoardRequest'
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: Updated board. ETag is the new board version.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
    delete:
      tags:
        - Boards
      operationId: deleteBoard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - confirmTitle
              properties:
                confirmTitle:
                  type: string
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /boards/{boardId}/members:
    parameters:
      - $ref: '#/components/parameters/boardId'
    get:
      tags:
        - Members
      operationId: listMembers
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
          description: Members of the board.
  /boards/{boardId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/boardId'
      - $ref: '#/components/parameters/userId'
    patch:
      tags:
        - Members
      operationId: changeRole
      parameters:
        - $ref: '#/components/parameters/ifMatchBoard'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: Updated membership. Ownership changes lock the board row.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/LastOwner'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
    delete:
      tags:
        - Members
      operationId: removeMember
      parameters:
        - $ref: '#/components/parameters/ifMatchBoard'
      responses:
        '204':
          description: Removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/LastOwner'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
  /boards/{boardId}/invitations:
    parameters:
      - $ref: '#/components/parameters/boardId'
    post:
      tags:
        - Invitations
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: Pending invitation created. Role is EDITOR or VIEWER only.
        '403':
          $ref: '#/components/responses/OwnerInviteForbidden'
        '409':
          $ref: '#/components/responses/AlreadyMember'
    get:
      tags:
        - Invitations
      operationId: listBoardInvitations
      parameters:
        - name: status
          in: query
          schema:
            type: string
            const: PENDING
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
          description: Invitations for the board. Default filter is PENDING.
  /boards/{boardId}/invitations/{invitationId}:
    delete:
      tags:
        - Invitations
      operationId: cancelInvitation
      parameters:
        - $ref: '#/components/parameters/boardId'
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Canceled
        '403':
          $ref: '#/components/responses/Forbidden'
  /invitations:
    get:
      tags:
        - Invitations
      operationId: listMyInvitations
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
          description: Pending invitations addressed to the caller email.
  /invitations/{invitationId}/accept:
    post:
      tags:
        - Invitations
      operationId: acceptInvitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: Invitation accepted and BoardMember created.
        '409':
          $ref: '#/components/responses/InvitationNotPending'
  /invitations/{invitationId}/reject:
    post:
      tags:
        - Invitations
      operationId: rejectInvitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Rejected
        '409':
          $ref: '#/components/responses/InvitationNotPending'
  /boards/{boardId}/columns:
    parameters:
      - $ref: '#/components/parameters/boardId'
    get:
      tags:
        - Columns
      operationId: listColumns
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Column'
          description: Columns ordered by position. Cards are not included.
    post:
      tags:
        - Columns
      operationId: createColumn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateColumnRequest'
      responses:
        '201':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
          description: Column created. ETag is the column version.
        '403':
          $ref: '#/components/responses/Forbidden'
  /boards/{boardId}/columns/reorder:
    post:
      tags:
        - Columns
      operationId: reorderColumns
      parameters:
        - $ref: '#/components/parameters/boardId'
        - $ref: '#/components/parameters/ifMatchBoard'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderedIds
              properties:
                orderedIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Column'
          description: Columns reassigned to 1024 position gaps. Requires board If-Match.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
  /columns/{columnId}:
    parameters:
      - $ref: '#/components/parameters/columnId'
    patch:
      tags:
        - Columns
      operationId: patchColumn
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchColumnRequest'
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
          description: Updated column. ETag is the new column version.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/LastDoneColumn'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
    delete:
      tags:
        - Columns
      operationId: deleteColumn
      responses:
        '204':
          description: Deleted
        '409':
          $ref: '#/components/responses/ColumnNotEmptyOrLastDone'
  /boards/{boardId}/cards:
    get:
      tags:
        - Cards
      operationId: listCards
      parameters:
        - $ref: '#/components/parameters/boardId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: columnId
          in: query
          schema:
            type: string
            format: uuid
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
          description: Cards on boards the caller belongs to, ordered by position.
  /columns/{columnId}/cards:
    post:
      tags:
        - Cards
      operationId: createCard
      parameters:
        - $ref: '#/components/parameters/columnId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '201':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
          description: Card created after the destination column lock and WIP check. ETag is the card version.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/WipExceeded'
        '422':
          $ref: '#/components/responses/CrossBoard'
  /cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/cardId'
    get:
      tags:
        - Cards
      operationId: getCard
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDetail'
          description: >-
            Card detail including computed blocked, checklist, and comments. ETag is the card
            version.
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Cards
      operationId: patchCard
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCardRequest'
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
          description: Updated card. ETag is the new card version.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/CrossBoard'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
    delete:
      tags:
        - Cards
      operationId: deleteCard
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
  /cards/{cardId}/move:
    post:
      tags:
        - Cards
      operationId: moveCard
      parameters:
        - $ref: '#/components/parameters/cardId'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveCardRequest'
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
          description: Card moved. warnings may include BLOCKED_BY_PREDECESSOR. ETag is the new card version.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/WipExceeded'
        '422':
          $ref: '#/components/responses/CrossBoard'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
  /cards/{cardId}/dependency:
    put:
      tags:
        - Cards
      operationId: setDependency
      parameters:
        - $ref: '#/components/parameters/cardId'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - predecessorId
              properties:
                predecessorId:
                  type:
                    - string
                    - 'null'
                  format: uuid
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
          description: Predecessor set or cleared under a board-row lock. ETag is the new card version.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/DependencyCycle'
        '422':
          $ref: '#/components/responses/CrossBoard'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
  /cards/{cardId}/checklist:
    put:
      tags:
        - Cards
      operationId: replaceChecklist
      parameters:
        - $ref: '#/components/parameters/cardId'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/ChecklistInput'
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDetail'
          description: Checklist replaced and card version incremented.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
  /cards/{cardId}/tags:
    put:
      tags:
        - Cards
      operationId: replaceTags
      parameters:
        - $ref: '#/components/parameters/cardId'
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - names
              properties:
                names:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 30
      responses:
        '200':
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
          description: Tags replaced. Tags are created in this board if missing.
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/CrossBoard'
        '428':
          $ref: '#/components/responses/IfMatchRequired'
  /cards/{cardId}/comments:
    parameters:
      - $ref: '#/components/parameters/cardId'
    get:
      tags:
        - Comments
      operationId: listComments
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
          description: Comments on the card, newest page by cursor.
    post:
      tags:
        - Comments
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: Comment created. Mentions of board members create notifications.
  /comments/{commentId}:
    patch:
      tags:
        - Comments
      operationId: patchComment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: Comment updated by its author or an Owner.
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
        - Comments
      operationId: deleteComment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
  /cards/{cardId}/activities:
    get:
      tags:
        - Cards
      operationId: listActivities
      parameters:
        - $ref: '#/components/parameters/cardId'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
          description: Append-only activity log. No update API.
  /notifications:
    get:
      tags:
        - Notifications
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - name: unread
          in: query
          schema:
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
          description: Notifications for the caller only.
  /notifications/{notificationId}/read:
    post:
      tags:
        - Notifications
      operationId: readNotification
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Marked read
  /notifications/read-all:
    post:
      tags:
        - Notifications
      operationId: readAllNotifications
      responses:
        '204':
          description: Marked read
  /search:
    get:
      tags:
        - Search
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
          description: Search hits limited to boards the caller belongs to.
        '422':
          $ref: '#/components/responses/InvalidInput'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    ETag:
      description: Quoted card, column, or board version. Send back as If-Match.
      schema:
        type: string
        examples:
          - '"3"'
  parameters:
    cursor:
      name: cursor
      in: query
      schema:
        type: string
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ifMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted integer version from ETag. Required on versioned writes.
      schema:
        type: string
    ifMatchBoard:
      name: If-Match
      in: header
      required: true
      description: Board version. Role changes and column reorder lock the board row.
      schema:
        type: string
    boardId:
      name: boardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    columnId:
      name: columnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    cardId:
      name: cardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: Missing or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHENTICATED
            message: 인증이 필요합니다.
            details: {}
    InvalidCredentials:
      description: Login failed without revealing whether the account exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_CREDENTIALS
            message: 이메일 또는 비밀번호가 올바르지 않습니다.
            details: {}
    NotMember:
      description: Authenticated but not a member. Includes invitees who have not accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_MEMBER
            message: 이 보드의 멤버가 아닙니다.
            details: {}
    Forbidden:
      description: Member but role is insufficient
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: 권한이 없습니다.
            details: {}
    OwnerInviteForbidden:
      description: OWNER invitations are not allowed in v1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Owner 역할은 초대할 수 없습니다.
            details:
              reason: OWNER_INVITE_NOT_ALLOWED
    NotFound:
      description: Missing, or hidden from non-members when the id is a card
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: 대상을 찾을 수 없습니다.
            details: {}
    InvalidInput:
      description: Malformed body or header/body version mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_INPUT
            message: 입력값이 올바르지 않습니다.
            details: {}
    EmailTaken:
      description: Email already registered
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: EMAIL_TAKEN
            message: 이미 가입된 이메일입니다.
            details: {}
    VersionConflict:
      description: If-Match does not match the stored version
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VERSION_CONFLICT
            message: 다른 수정이 먼저 반영되었습니다.
            details:
              version: 5
    IfMatchRequired:
      description: Versioned write without If-Match
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: IF_MATCH_REQUIRED
            message: If-Match 헤더가 필요합니다.
            details: {}
    WipExceeded:
      description: Destination column is at its limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: WIP_LIMIT_EXCEEDED
            message: 이 컬럼의 한도를 초과했습니다.
            details:
              wipLimit: 3
              count: 3
    DependencyCycle:
      description: Predecessor chain would loop. Board row was locked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: DEPENDENCY_CYCLE
            message: 순환 의존은 허용되지 않습니다.
            details: {}
    CrossBoard:
      description: Column, predecessor, tag, or assignee is not on this board
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: CROSS_BOARD
            message: 다른 보드의 데이터와 연결할 수 없습니다.
            details: {}
    LastOwner:
      description: Change would leave the board with zero owners
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: LAST_OWNER
            message: 마지막 Owner는 바꾸거나 제거할 수 없습니다.
            details: {}
    LastDoneColumn:
      description: Change would leave the board with zero done columns
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: LAST_DONE_COLUMN
            message: 완료 컬럼은 하나 이상 있어야 합니다.
            details: {}
    ColumnNotEmptyOrLastDone:
      description: >-
        COLUMN_NOT_EMPTY if the column has cards. LAST_DONE_COLUMN if it is the last done column.
        Non-empty is checked first.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notEmpty:
              value:
                code: COLUMN_NOT_EMPTY
                message: 카드가 있는 컬럼은 지울 수 없습니다.
                details: {}
            lastDone:
              value:
                code: LAST_DONE_COLUMN
                message: 완료 컬럼은 하나 이상 있어야 합니다.
                details: {}
    AlreadyMember:
      description: Email is already a member or has a pending invitation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: ALREADY_MEMBER
            message: 이미 멤버이거나 초대 대기 중입니다.
            details: {}
    InvitationNotPending:
      description: Accept or reject called on a non-pending invitation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVITATION_NOT_ACCEPTED
            message: 대기 중인 초대가 아닙니다.
            details: {}
    RoleChangeConflict:
      description: >-
        Role change conflict. VERSION_CONFLICT if the board If-Match is stale. LAST_OWNER if the
        change leaves zero owners. The board row is locked before the count.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            versionConflict:
              value:
                code: VERSION_CONFLICT
                message: 다른 수정이 먼저 반영되었습니다.
                details:
                  version: 5
            lastOwner:
              value:
                code: LAST_OWNER
                message: 마지막 Owner는 바꾸거나 제거할 수 없습니다.
                details: {}
    ColumnPatchConflict:
      description: >-
        Column update conflict. VERSION_CONFLICT if If-Match is stale. LAST_DONE_COLUMN if this is
        the last done column being cleared.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            versionConflict:
              value:
                code: VERSION_CONFLICT
                message: 다른 수정이 먼저 반영되었습니다.
                details:
                  version: 4
            lastDone:
              value:
                code: LAST_DONE_COLUMN
                message: 완료 컬럼은 하나 이상 있어야 합니다.
                details: {}
    MoveConflict:
      description: >-
        Move conflict. VERSION_CONFLICT if the card If-Match is stale. WIP_LIMIT_EXCEEDED if the
        locked destination column is at its limit. The card stays in the source column.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            versionConflict:
              value:
                code: VERSION_CONFLICT
                message: 다른 수정이 먼저 반영되었습니다.
                details:
                  version: 8
            wip:
              value:
                code: WIP_LIMIT_EXCEEDED
                message: 이 컬럼의 한도를 초과했습니다.
                details:
                  wipLimit: 3
                  count: 3
    DependencyConflict:
      description: >-
        Dependency conflict under the board-row lock. VERSION_CONFLICT if the card If-Match is
        stale. DEPENDENCY_CYCLE if the chain returns to this card.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            versionConflict:
              value:
                code: VERSION_CONFLICT
                message: 다른 수정이 먼저 반영되었습니다.
                details:
                  version: 6
            cycle:
              value:
                code: DEPENDENCY_CYCLE
                message: 순환 의존은 허용되지 않습니다.
                details: {}
  schemas:
    Error:
      type: object
      required:
        - code
        - message
        - details
      properties:
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - INVALID_CREDENTIALS
            - NOT_MEMBER
            - FORBIDDEN
            - NOT_FOUND
            - INVALID_INPUT
            - EMAIL_TAKEN
            - VERSION_CONFLICT
            - IF_MATCH_REQUIRED
            - WIP_LIMIT_EXCEEDED
            - DEPENDENCY_CYCLE
            - CROSS_BOARD
            - LAST_OWNER
            - LAST_DONE_COLUMN
            - COLUMN_NOT_EMPTY
            - ALREADY_MEMBER
            - INVITATION_NOT_ACCEPTED
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    Role:
      type: string
      enum:
        - OWNER
        - EDITOR
        - VIEWER
    InviteRole:
      type: string
      enum:
        - EDITOR
        - VIEWER
    Page:
      type: object
      required:
        - items
        - nextCursor
      properties:
        nextCursor:
          type:
            - string
            - 'null'
    User:
      type: object
      required:
        - id
        - email
        - nickname
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        nickname:
          type: string
        avatarUrl:
          type:
            - string
            - 'null'
        createdAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - nickname
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        nickname:
          type: string
          minLength: 1
          maxLength: 30
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AuthResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - user
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'
    PatchMeRequest:
      type: object
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 30
        avatarUrl:
          type:
            - string
            - 'null'
    Board:
      type: object
      required:
        - id
        - title
        - color
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type:
            - string
            - 'null'
        color:
          type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BoardPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Board'
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BoardListItem'
      required:
        - items
        - nextCursor
    CreateBoardRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        color:
          type: string
    PatchBoardRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type:
            - string
            - 'null'
        color:
          type: string
    Member:
      type: object
      required:
        - userId
        - role
        - joinedAt
      properties:
        userId:
          type: string
          format: uuid
        nickname:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        joinedAt:
          type: string
          format: date-time
    Invitation:
      type: object
      required:
        - id
        - boardId
        - inviteeEmail
        - requestedRole
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        inviteeEmail:
          type: string
          format: email
        requestedRole:
          $ref: '#/components/schemas/InviteRole'
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REJECTED
            - CANCELED
        createdAt:
          type: string
          format: date-time
        respondedAt:
          type:
            - string
            - 'null'
          format: date-time
    CreateInvitationRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/InviteRole'
    Column:
      type: object
      required:
        - id
        - boardId
        - title
        - position
        - isDone
        - version
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        title:
          type: string
        position:
          type: integer
        wipLimit:
          type:
            - integer
            - 'null'
          minimum: 1
        isDone:
          type: boolean
        version:
          type: integer
          minimum: 1
    CreateColumnRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 40
        wipLimit:
          type:
            - integer
            - 'null'
          minimum: 1
        isDone:
          type: boolean
          default: false
    PatchColumnRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 40
        wipLimit:
          type:
            - integer
            - 'null'
          minimum: 1
        isDone:
          type: boolean
    Card:
      type: object
      required:
        - id
        - boardId
        - columnId
        - title
        - position
        - blocked
        - warnings
        - version
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        boardId:
          type: string
          format: uuid
        columnId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type:
            - string
            - 'null'
        assigneeId:
          type:
            - string
            - 'null'
          format: uuid
        dueAt:
          type:
            - string
            - 'null'
          format: date-time
        position:
          type: integer
        predecessorId:
          type:
            - string
            - 'null'
          format: uuid
        blocked:
          type: boolean
          description: Computed. True when predecessor exists and predecessor column is not done.
        warnings:
          type: array
          items:
            type: string
            enum:
              - BLOCKED_BY_PREDECESSOR
        tagNames:
          type: array
          items:
            type: string
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CardDetail:
      allOf:
        - $ref: '#/components/schemas/Card'
        - type: object
          properties:
            checklist:
              type: array
              items:
                $ref: '#/components/schemas/ChecklistItem'
            comments:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
    CardPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Card'
    CreateCardRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        assigneeId:
          type:
            - string
            - 'null'
          format: uuid
        dueAt:
          type:
            - string
            - 'null'
          format: date-time
        predecessorId:
          type:
            - string
            - 'null'
          format: uuid
        tagNames:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 30
    PatchCardRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type:
            - string
            - 'null'
        assigneeId:
          type:
            - string
            - 'null'
          format: uuid
        dueAt:
          type:
            - string
            - 'null'
          format: date-time
    MoveCardRequest:
      type: object
      required:
        - toColumnId
      properties:
        toColumnId:
          type: string
          format: uuid
        beforeCardId:
          type:
            - string
            - 'null'
          format: uuid
    ChecklistInput:
      type: object
      required:
        - content
        - done
      properties:
        id:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
          maxLength: 200
        done:
          type: boolean
    ChecklistItem:
      allOf:
        - $ref: '#/components/schemas/ChecklistInput'
        - type: object
          required:
            - id
            - position
          properties:
            position:
              type: integer
    Comment:
      type: object
      required:
        - id
        - cardId
        - authorId
        - body
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        cardId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CommentPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
    Activity:
      type: object
      required:
        - id
        - action
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - CARD_CREATED
            - CARD_MOVED
            - ASSIGNEE_CHANGED
            - DUE_CHANGED
            - DEPENDENCY_SET
            - DEPENDENCY_CLEARED
            - CHECKLIST_CHANGED
            - CARD_UPDATED
            - CARD_DELETED
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    ActivityPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Activity'
    Notification:
      type: object
      required:
        - id
        - type
        - resourceType
        - resourceId
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - INVITED
            - ASSIGNED
            - MENTIONED
            - DUE_SOON
            - OVERDUE
        resourceType:
          type: string
        resourceId:
          type: string
          format: uuid
        dueAtSnapshot:
          type:
            - string
            - 'null'
          format: date-time
        readAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Notification'
    SearchHit:
      type: object
      required:
        - kind
        - id
        - title
        - boardId
      properties:
        kind:
          type: string
          enum:
            - CARD
            - BOARD
        id:
          type: string
          format: uuid
        title:
          type: string
        boardId:
          type: string
          format: uuid
    SearchPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SearchHit'
    BoardListItem:
      allOf:
        - $ref: '#/components/schemas/Board'
        - type: object
          required:
            - myRole
          properties:
            myRole:
              $ref: '#/components/schemas/Role'
              description: Caller membership role on this board. Not a stored column.
